name: Update Current Streak

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculate streak
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          python3 <<'PY'
          import os
          import subprocess
          import json
          from datetime import datetime, timedelta, timezone

          username = os.environ["USERNAME"]

          query = """
          query($login:String!) {
            user(login:$login) {
              contributionsCollection {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          result = subprocess.run(
              [
                  "gh", "api", "graphql",
                  "-f", f"query={query}",
                  "-f", f"login={username}"
              ],
              capture_output=True,
              text=True,
              check=True
          )

          data = json.loads(result.stdout)

          days = []

          for week in data["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]:
              for day in week["contributionDays"]:
                  days.append(day)

          days.sort(key=lambda x: x["date"], reverse=True)

          today = datetime.now(timezone.utc).date()

          contribution_dates = {
              datetime.strptime(d["date"], "%Y-%m-%d").date()
              for d in days
              if d["contributionCount"] > 0
          }

          # Si hoy todavía no hay actividad, empezamos comprobando ayer.
          current = today

          if current not in contribution_dates:
              current -= timedelta(days=1)

          streak = 0

          while current in contribution_dates:
              streak += 1
              current -= timedelta(days=1)

          readme = "README.md"

          with open(readme, "r", encoding="utf-8") as f:
              content = f.read()

          start = "<!-- STREAK_START -->"
          end = "<!-- STREAK_END -->"

          replacement = (
              f"{start}\n"
              f"🔥 **Current Streak:** {streak} days\n"
              f"{end}"
          )

          start_pos = content.find(start)
          end_pos = content.find(end)

          if start_pos == -1 or end_pos == -1:
              raise SystemExit("No se encontraron los marcadores del streak.")

          end_pos += len(end)

          content = (
              content[:start_pos]
              + replacement
              + content[end_pos:]
          )

          with open(readme, "w", encoding="utf-8") as f:
              f.write(content)

          print(f"Current streak: {streak} days")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          git diff --cached --quiet || git commit -m "🔥 Update current streak"

          git push
