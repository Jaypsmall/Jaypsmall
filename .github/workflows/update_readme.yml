name: Actualizar Showcase de Apps

on:
  push:
    paths:
      - 'apps.json'
      - 'update_readme.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Actualizar README
        run: python update_readme.py

      - name: Commit & Push si hay cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: actualización de Showcase de apps" && git push)
